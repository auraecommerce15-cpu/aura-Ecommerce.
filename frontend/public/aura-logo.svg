<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <linearGradient id="auraPurpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="40%" stop-color="#8B5CF6" />
      <stop offset="80%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.2" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Triangular Stylized 'A' Icon -->
  <g transform="translate(10, 10)">
    <!-- Ambient back glow -->
    <path d="M50 8 L92 88 L68 88 L50 48 L32 88 L8 88 Z" fill="url(#auraGlow)" filter="url(#subtleGlow)" />
    <!-- Left to Top Ribbon -->
    <path d="M50 8 L92 88 L68 88 L50 48 L32 88 L8 88 Z" fill="url(#auraPurpleGrad)" />
    <!-- Crossbar / Dynamic Fold Accent -->
    <path d="M28 66 L72 66 L64 52 L36 52 Z" fill="#DDD6FE" opacity="0.9" />
    <!-- Inner Shadow Cut for 3D Ribbon Look -->
    <path d="M50 8 L68 88 L50 48 Z" fill="#4338CA" opacity="0.35" />
    <path d="M50 8 L32 88 L50 48 Z" fill="#FFFFFF" opacity="0.15" />
  </g>

  <!-- 'AURA' Wordmark -->
  <text x="125" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="0.16em" fill="#0F172A">
    AURA
  </text>

  <!-- 'Shop Smarter. Live Better.' Tagline -->
  <text x="128" y="94" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" letter-spacing="0.02em" fill="#64748B">
    Shop Smarter. Live Better.
  </text>
</svg>
